runtime:
  timezone: Asia/Tokyo
  log_level: INFO

risk:
  target_annual_vol: 0.10
  vol_lookback_days: 60
  active_signal_threshold: 0.05
  single_root_soft_cap_fraction_of_nav: 0.12
  asset_class_soft_cap_fraction_of_nav: 0.35
  initial_margin_soft_cap_fraction_of_nav: 0.35
  initial_margin_hard_cap_fraction_of_nav: 0.50
  contract_rounding: half_away_from_zero
  post_rounding_recheck: true
  max_integer_reduction_steps: 500

portfolio:
  risk_budget_mode: equal_risk_sqrt_active
  estimate_trade_costs_in_target_layer: true
  zero_target_on_invalid_inputs: true

costs:
  default_broker: research_default
  commission_per_contract_side_usd:
    equity_index: 1.50
    rates: 1.35
    fx: 1.35
    metals: 1.85
    energy: 2.35
    agriculture: 1.85
  slippage_ticks_per_side:
    equity_index: 0.50
    rates: 0.50
    fx: 0.75
    metals: 0.75
    energy: 1.00
    agriculture: 1.00
  roll_extra_ticks_per_contract_side:
    equity_index: 0.25
    rates: 0.25
    fx: 0.25
    metals: 0.50
    energy: 0.75
    agriculture: 0.50

monitoring:
  data_quality:
    max_missing_settlement_roots: 0
    max_missing_volume_roots: 0
    max_contract_map_conflicts: 0
    max_duplicate_feature_rows: 0
    max_feature_missing_fraction: 0.01
    max_stale_feature_roots: 0
  model_health:
    require_artifact_hash_match: true
    require_cpd_service_success: true
    max_nonfinite_signal_roots: 0
    max_signal_saturation_fraction: 0.35
    min_cross_sectional_signal_std: 0.02
    max_feature_psi: 0.20
  risk_health:
    realized_vol_warning: 0.12
    realized_vol_reduce_only: 0.14
    margin_usage_warning: 0.35
    margin_usage_reduce_only: 0.50
    max_position_reconciliation_mismatches: 0
  execution_health:
    require_broker_state_known: true
    max_order_reject_count: 0
    min_fill_ratio_warning: 0.80
    max_slippage_ratio_warning: 1.25
    max_slippage_ratio_fallback: 1.50
  strategy_health:
    min_cpd_60d_net_sharpe_before_review: -0.25
    max_consecutive_cpd_underperformance_windows: 2
    min_reversal_edge_usd: 0.0

roll:
  policy_version: volume3_hardroll_v1
  builder_version: roll_engine_v1
  volume_confirmation_days: 3
  effective_lag_trading_days: 1
  volume_column: volume
  volume_trigger_operator: next_strictly_greater_than_front
  missing_volume_resets_confirmation: true
  hard_roll_anchor_preference:
    - last_trade_date
    - expiration_date
  calendar_source: root_contracts_daily_dates
  no_rollback: true

continuous:
  series_id: v1_back_ratio_settle
  builder_version: continuous_builder_v1
  strict_roll_ratio: true
  allow_close_fallback: true
  allowed_settle_statuses:
    - final
    - preliminary
    - close_fallback
  blocked_settle_statuses:
    - missing
  max_abs_daily_return_warning: 0.20
  max_abs_daily_return_error: 0.50

features:
  feature_set_id: features_v1
  builder_version: features_builder_v1
  series_id: v1_back_ratio_settle
  price_column: adj_settle_price
  return_column: daily_return
  annualization_factor: 252
  warmup_days: 252
  epsilon: 1.0e-12
  horizons:
    normalized_returns: [1, 21, 63, 126, 252]
  volatility:
    estimator: ewm_std
    span_days: 60
    min_periods: 20
    ratio_pairs:
      - [20, 60]
      - [60, 252]
  macd:
    method: log_price_ema_diff_zscore
    pairs:
      - [8, 24]
      - [16, 48]
      - [32, 96]
    zscore_span_days: 252
    zscore_min_periods: 63
  cpd:
    builder_version: cpd_builder_v1
    method: two_sample_t_v1
    windows: [21, 63]
    min_segment_days: 5
    min_segment_fraction: 0.25
    input_return: vol_scaled_daily_return
    score_transform: one_minus_exp_half_t2
  clipping:
    normalized_return_abs_max: 20.0
    macd_abs_max: 20.0
    vol_ratio_min: 0.05
    vol_ratio_max: 20.0
    cpd_score_min: 0.0
    cpd_score_max: 1.0

signals:
  output_dataset: data/research/signals_daily
  qa_artifact_dir: artifacts/wp8
  default_write_mode: overwrite_partition
  stable_sort_keys: [as_of_date, root]
  clip_min: -1.0
  clip_max: 1.0

strategies:
  tsmom:
    strategy_id: tsmom
    model_id: tsmom_v1
    signal_version: tsmom_signal_v1
    formula_artifact_dir: artifacts/strategies/tsmom_v1
    feature_set_id: features_v1
    required_features: [ret_21, ret_63, ret_252]
    horizons_days: [21, 63, 252]
    weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
    sign_zero_policy: zero
    allow_partial_horizons: false
    require_feature_complete: true
    require_warmup_status_ok: true
    invalid_reasons:
      missing_required_feature: missing_required_feature
      nonfinite_required_feature: nonfinite_required_feature
      feature_incomplete: feature_incomplete
      warmup_not_ok: warmup_not_ok
      root_not_requested: root_not_requested

models:
  cpd_lstm:
    model_family: cpd_lstm_v1
    strategy_id: cpd_lstm
    feature_set_id: features_v1
    series_id: v1_back_ratio_settle
    sequence_length: 63
    annualization_factor: 252
    epsilon: 1.0e-12
    feature_order:
      - ret_1
      - ret_21
      - ret_63
      - ret_126
      - ret_252
      - macd_8_24
      - macd_16_48
      - macd_32_96
      - cpd21_score
      - cpd21_age
      - cpd63_score
      - cpd63_age
      - vol_20_60
      - vol_60_252
    labels:
      horizon_root_trading_days: 1
      return_source: continuous_daily.daily_return
      normalize_by: annualized_vol_60
      normalized_return_clip_abs: 10.0
      min_annualized_vol: 0.01
    standardization:
      enabled: true
      fit_scope: train_only
      method: zscore
      min_std: 1.0e-6
      clip_abs_after_standardization: 10.0
    architecture:
      input_size: 14
      hidden_size: 64
      num_layers: 1
      dropout_after_lstm: 0.20
      head_hidden_size: 32
      output_activation: tanh
      output_clip_abs: 1.0
    training:
      optimizer: adamw
      learning_rate: 0.0003
      weight_decay: 0.0001
      max_epochs: 50
      min_epochs: 5
      early_stopping_patience: 8
      gradient_clip_norm: 1.0
      seed: 42
      deterministic_mode: warn
      device: auto
      dtype: float32
      batch_mode: full_panel
      validation_metric: sharpe_ex_cost
      cost_bps_default: 2.0
      turnover_cost_multiplier: 1.0
      signal_l2_penalty: 1.0e-4
      turnover_l1_penalty: 0.0
    smoke:
      max_epochs: 3
      min_epochs: 1
      roots: [ES, NQ]
      n_days: 180

walkforward:
  frequency: quarterly
  train_years: 10
  val_years: 2
  min_train_days: 1260
  min_val_days: 252
  min_oos_days: 20
  sequence_length: 63
  label_horizon_days: 1
  global_seed: 1729
  nav_usd: 1000000.0
  initial_margin_fraction_of_notional: 0.10
  report_bootstrap:
    block_length_days: 20
    n_bootstrap_samples: 200
    min_observations: 30
  reversal_bucket:
    threshold_quantile: 0.95
    cooldown_days: 5
    horizons: [1, 5, 20]
  gates:
    full_oos_net_sharpe_min: 0.90
    last_8_quarters_net_sharpe_min: 0.60
    max_drawdown_vs_tsmom_max_multiple: 1.50
    reversal_5d_diff_min: 0.0
    reversal_20d_diff_min: 0.0
    cost_to_gross_pnl_max: 0.50
    min_completed_folds: 8
  smoke:
    train_years: 2
    val_years: 1
    min_train_days: 120
    min_val_days: 40
    min_oos_days: 10
    max_epochs: 1
    min_epochs: 1
    roots: [ES, NQ]
    n_days: 1100
