version: 1.0.0
status: frozen-for-v1-bootstrap
effective_date: 2026-04-17
description: >-
  v1.0 instrument master for the CPD-LSTM / distributed TSMOM shadow trading stack.
  This file is the single source of truth for universe membership, contract economics,
  hard-roll overrides, and optional micro-contract substitutes.

policy:
  standard_contracts_are_primary: true
  auto_micro_substitution_enabled: false
  roll_primary_rule: volume_lead_3day
  roll_volume_field: official_daily_volume
  signal_price_priority:
    - official_settlement
    - official_close
  continuous_method: backward_ratio_adjusted
  databento_dataset: GLBX.MDP3
  timezone: America/Chicago

hard_roll_defaults:
  equity_index:
    anchor: last_trade_date
    business_days_before: 5
  rates:
    anchor: last_trade_date
    business_days_before: 5
  fx:
    anchor: last_trade_date
    business_days_before: 5
  metals:
    anchor: first_notice_or_last_trade_date
    business_days_before: 10
  energy:
    anchor: first_notice_or_last_trade_date
    business_days_before: 10
  agriculture:
    anchor: first_notice_or_last_trade_date
    business_days_before: 10

fields_guide:
  quote_multiplier_to_usd_notional: >-
    Multiplier used to convert the stored quoted price into approximate USD contract notional.
    Example: ES uses 50.0, ZN uses 1000.0, ZC uses 50.0 because 5,000 bushels x $0.01.
  min_price_increment: >-
    Minimum outright tick in the same quote units expected from curated daily prices.
    For grains this is 0.25, meaning one-quarter cent per bushel.
  micro_substitute.status:
    - approved
    - restricted
    - none

instruments:
  - root: ES
    display_name: E-mini S&P 500 futures
    exchange: CME
    venue: CME Globex
    asset_class: equity_index
    sub_asset_class: us_large_cap
    currency: USD
    price_quote: index_points
    contract_unit_text: "$50 x S&P 500 Index"
    quote_multiplier_to_usd_notional: 50.0
    min_price_increment: 0.25
    tick_value_usd: 12.50
    hard_roll_anchor: last_trade_date
    hard_roll_business_days_before: 5
    micro_substitute:
      root: MES
      available: true
      ratio_to_standard: 10
      status: approved
      default_auto_substitute: false
      note: Exact 1/10 micro counterpart. Kept disabled by default in v1.0.

