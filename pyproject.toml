[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpd-shadow"
version = "0.1.0"
description = "CPD-LSTM shadow trading system skeleton"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Project owner" }]
dependencies = [
  "databento>=0.75,<1.0",
  "duckdb>=1.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
  "tenacity>=8.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
